name: Publish React Packages

on:
  push:
    paths:
      - '.changeset/**'
      # The package dirs are triggers so the changeset guard below can catch a
      # source push that carries no changeset — before this, such a push
      # started no workflow at all and the non-release was silent (the
      # auto-changeset hook the npm-publishing skill describes is not
      # installed). The version commit this workflow pushes says [skip ci],
      # so consuming changesets never re-triggers. This list and the guard's
      # filter below both mirror pnpm-workspace.yaml — a new package goes in
      # all three places.
      - 'utils/**'
      - 'data-utils/**'
      - 'hooks/**'
      - 'charts/**'
      - 'command-palette/**'
      - 'account/**'
      - 'datatable/**'
      - 'filters/**'
      - 'forms/**'
      - 'navigation/**'
      - 'themes/**'
      - '.github/workflows/publish-react-packages.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Publishes serialize and are never cancelled: killing a run mid-publish can
# leave a half-released version (artifact uploaded, tag/commit lost), and two
# runs computing the same next version from the same tag state must run in
# order, not in parallel.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://npm.pkg.github.com
          scope: '@bcl32'

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for pending changesets
        id: changesets
        run: |
          # Count changeset files (excluding README.md and config.json)
          count=$(find .changeset -name '*.md' ! -name 'README.md' | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
            echo "Found $count pending changeset(s)"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets found"
          fi

      # push only: paths-filter diffs the push range (event.before..sha, which
      # needs the fetch-depth: 0 checkout above); a workflow_dispatch has no
      # range, so the guard below does not apply there. The dir list mirrors
      # pnpm-workspace.yaml, same as the trigger paths above.
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'push'
        id: srcfilter
        with:
          filters: |
            source:
              - 'utils/**'
              - 'data-utils/**'
              - 'hooks/**'
              - 'charts/**'
              - 'command-palette/**'
              - 'account/**'
              - 'datatable/**'
              - 'filters/**'
              - 'forms/**'
              - 'navigation/**'
              - 'themes/**'

      - name: Guard — package source changed but no changeset is pending
        # A package-source push with no pending changeset publishes nothing,
        # and before this guard nothing said so. Fail the run loudly instead;
        # the push has already landed, so the remedy is a follow-up commit.
        if: >-
          github.event_name == 'push' &&
          steps.changesets.outputs.has_changesets == 'false' &&
          steps.srcfilter.outputs.source == 'true'
        run: |
          echo "::error::package source changed in this push but no changeset is pending — nothing will be published. Add one with 'pnpm changeset' (or 'pnpm changeset --empty' to record that no release is intended) and push again."
          exit 1

      - name: Version packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          pnpm changeset version
          pnpm install --no-frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect bumped packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: bash .github/scripts/publish-verify.sh detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build bumped packages (+ workspace dependency chain)
        if: steps.changesets.outputs.has_changesets == 'true'
        # --filter "<pkg>..." selects the bumped package AND its workspace
        # dependencies — the bumped package's dist for the collision precheck's
        # `pnpm pack`, and the deps' dist/ that tsup dts generation resolves.
        # Unbumped, non-dependency packages are skipped entirely (they are not
        # published: `pnpm -r publish` skips versions already on the registry).
        run: |
          BUMPED_FILE="${RUNNER_TEMP}/publish-bumped.txt"
          if [ ! -s "$BUMPED_FILE" ]; then
            echo "::warning::no bumped packages recorded — falling back to full build"
            pnpm -r build
            exit 0
          fi
          filters=()
          while read -r spec _dir; do
            [ -n "$spec" ] || continue
            filters+=(--filter "${spec%@*}...")
          done < "$BUMPED_FILE"
          echo "Building: ${filters[*]}"
          pnpm "${filters[@]}" build

      - name: Typecheck bumped packages (+ workspace dependency chain)
        if: steps.changesets.outputs.has_changesets == 'true'
        # Every package defines `typecheck: tsc --noEmit`, and nothing ran it —
        # the only gate on a release was that tsup managed to emit a bundle, and
        # tsup transpiles without typechecking, so a type error shipped.
        #
        # AFTER the build step, deliberately: no tsconfig here declares `paths`,
        # so a cross-package import like `@bcl32/utils` resolves through the
        # workspace symlink and (moduleResolution: bundler) lands on that
        # package's `exports.types` -> ./dist/index.d.ts. Typechecking before
        # the dependencies' dist/ exists would fail on missing declarations
        # rather than on real type errors.
        #
        # Same filtered set as the build, re-derived from the same file so the
        # two steps cannot drift: `<pkg>...` is the bumped package plus its
        # workspace dependencies. A non-zero tsc exit fails the run, before
        # anything reaches the registry.
        run: |
          BUMPED_FILE="${RUNNER_TEMP}/publish-bumped.txt"
          if [ ! -s "$BUMPED_FILE" ]; then
            echo "::warning::no bumped packages recorded — falling back to full typecheck"
            pnpm -r typecheck
            exit 0
          fi
          filters=()
          while read -r spec _dir; do
            [ -n "$spec" ] || continue
            filters+=(--filter "${spec%@*}...")
          done < "$BUMPED_FILE"
          echo "Typechecking: ${filters[*]}"
          pnpm "${filters[@]}" typecheck

      - name: Pre-publish collision check
        # Fails BEFORE publishing if a bumped version already exists on the
        # registry with DIFFERENT contents (the 2026-07-04 stale-artifact
        # incident). An identical already-published artifact is treated as a
        # benign retry. See .github/scripts/publish-verify.sh.
        if: steps.changesets.outputs.has_changesets == 'true'
        run: bash .github/scripts/publish-verify.sh precheck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          set +e
          out="$(pnpm -r publish --no-git-checks 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          # `pnpm -r publish` queries the registry and skips any version that is
          # already published (it prints "There are no new packages that should
          # be published" and exits 0). The Pre-publish collision check above has
          # already hard-failed on any DIFFERENT artifact sitting on a bumped
          # version. So any non-zero exit here is a genuine failure — auth,
          # network, build, or a real registry error — and must fail the release
          # loudly instead of being swallowed.
          if [ "$rc" -ne 0 ]; then
            echo "::error::Publish failed (exit $rc) — see the pnpm/npm error above"
            exit "$rc"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published versions
        # Confirms every bumped version is actually present on the registry
        # (retries for propagation lag) before the version commit is pushed.
        if: steps.changesets.outputs.has_changesets == 'true'
        run: bash .github/scripts/publish-verify.sh postcheck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version changes and push
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: version packages [skip ci]"
            git push
          else
            echo "No version changes to commit"
          fi
